server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /stub_status {
        stub_status;
        allow all;
    }


    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # OmniRoute Reverse Proxy Integration
    location /v1 {
        proxy_pass http://host.docker.internal:20128/v1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /home {
        proxy_pass http://host.docker.internal:20128/home;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /dashboard/ {
        proxy_pass http://host.docker.internal:20128/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
