global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'trackos'

scrape_configs:

  # TrackOS backend — custom metrics + Node.js defaults
  - job_name: 'trackos-backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Nginx exporter
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
