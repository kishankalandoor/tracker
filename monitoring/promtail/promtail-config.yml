server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # TrackOS Backend container logs
  - job_name: backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['universal_tracker_api']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
      - labels:
          level:
          service:
      # Tag AI-related log lines
      - match:
          selector: '{container="universal_tracker_api"}'
          stages:
            - regex:
                expression: '(?P<ai_event>\[AI\]|\[Chat\]|\[Routine\])'
            - labels:
                ai_event:

  # TrackOS Frontend (Nginx) container logs
  - job_name: frontend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['universal_tracker_web']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Parse Nginx access log format
      - regex:
          expression: '(?P<remote_addr>\S+) - \S+ \[.*\] "(?P<method>\S+) (?P<path>\S+) \S+" (?P<status>\d+) (?P<bytes>\d+)'
      - labels:
          method:
          status:
      # Flag errors
      - match:
          selector: '{container="universal_tracker_web"}'
          stages:
            - regex:
                expression: '(?P<nginx_error>error|crit|alert|emerg)'
            - labels:
                nginx_error:

  # MongoDB container logs
  - job_name: mongodb
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['universal_tracker_db']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
